# Сапер - Описание интерфейса

## Главное меню (MainWindow)

Главное меню открывается при запуске приложения. В нем можно настроить параметры игры и начать новую игру или продолжить сохраненную.

### Кнопки

- **Новая игра** - открывает окно игры с новыми настройками. При нажатии создается новое игровое поле с указанными параметрами.
- **Продолжить игру** - загружает сохраненную игру из файла. Кнопка активируется только если в папке сохранений существует файл с указанным именем в выбранном формате (JSON или XML). Если файла нет, кнопка неактивна (серый цвет).
- **Топ лидеров** - открывает окно с таблицей лучших результатов. Кнопка всегда активна.

### Поля ввода и настройки

- **Строки** - текстовое поле для ввода количества строк игрового поля (5-20). По умолчанию: 5.
- **Столбцы** - текстовое поле для ввода количества столбцов игрового поля (5-20). По умолчанию: 5.
- **Процент мин** - выпадающий список для выбора процента мин на поле:
  - 20% - легкий уровень
  - 30% - средний уровень (по умолчанию)
  - 40% - сложный уровень
- **Формат сохранения** - выпадающий список для выбора формата файла сохранения:
  - JSON (по умолчанию)
  - XML
  При смене формата автоматически конвертирует существующий файл сохранения, если он есть.
- **Имя файла** - текстовое поле для ввода имени файла сохранения (без расширения). По умолчанию: "save".
- **Папка сохранений** - текстовое поле для указания пути к папке сохранений. По умолчанию используется папка "Saves" в каталоге приложения. Рядом находится кнопка **...** для выбора папки через диалоговое окно.

## Окно игры (GameWindow)

Окно игры открывается при нажатии кнопки "Новая игра" или "Продолжить игру" в главном меню.

### Верхняя панель

- **Меню** - кнопка для возврата в главное меню. При нажатии:
  - Если игра проиграна или выиграна - удаляет файл сохранения и возвращает в меню
  - Если игра в процессе - сохраняет текущее состояние и возвращает в меню
- **Мины** - отображает количество оставшихся мин (общее количество мин минус количество поставленных флагов)
- **Время** - отображает прошедшее время игры в секундах (максимум 300 секунд = 5 минут)
- **Поле** - отображает размер игрового поля в формате "Строки x Столбцы"

### Игровое поле

- Игровое поле отображается в виде сетки кнопок
- **Левый клик** по клетке:
  - Если клетка с миной - проигрыш, открываются все мины
  - Если клетка с цифрой - открывается и показывает количество соседних мин
  - Если пустая клетка - открывается и автоматически открывает соседние клетки до границ с цифрами
- **Правый клик** по клетке:
  - Ставит или снимает флаг
  - Флаги можно ставить только после первого клика (после генерации мин)
  - При постановке флага на последнюю мину - победа, если все остальные клетки открыты или правильно помечены флагами

### Статус

- Внизу окна отображается статус игры:
  - "Кликните для начала!" - игра не началась
  - "Время вышло! Игра окончена!" - проигрыш по времени
  - "Вы победили!" - победа
  - "Игра окончена!" - проигрыш при открытии мины

### Окна сообщений

- **Победа** - появляется при выигрыше, показывает сообщение "Поздравляем! Вы победили!" и количество набранных очков
- **Проигрыш** - появляется при открытии мины или истечении времени, показывает сообщение "Игра окончена! Вы наткнулись на мину."

## Окно топа лидеров (HighScoresWindow)

Окно топа лидеров открывается при нажатии кнопки "Топ лидеров" в главном меню.

### Элементы

- **Топ лидеров** - заголовок окна
- **Список** - отображает до 10 лучших результатов в формате "Имя файла - Размер поля - Очки очков". Список сортируется по убыванию очков.
- **Закрыть** - кнопка для закрытия окна и возврата в главное меню

### Логика сохранения результатов

- Результат сохраняется автоматически при победе
- Сохраняется только если результат превышает минимальный результат в текущем топ-10 (или если в топе меньше 10 записей)
- Результаты сохраняются в файл `highscores.txt` в папке сохранений
- Формат записи: "Имя файла - СтрокиxСтолбцы - Очки очков"

## Навигация между окнами

- **Главное меню → Игра**: нажать "Новая игру" или "Продолжить игру"
- **Игра → Главное меню**: нажать кнопку "Меню" или закрыть окно игры
- **Главное меню → Топ лидеров**: нажать "Топ лидеров"
- **Топ лидеров → Главное меню**: нажать "Закрыть"

## Особенности игры

- Мины генерируются при первом клике, чтобы гарантировать, что первая клетка не содержит мину
- Каждая мина окружена минимум 3 клетками с числами (если возможно)
- Если невозможно обеспечить требуемое окружение для мины, генерация прекращается
- Таймер ограничен 300 секундами (5 минут)
- При истечении времени - проигрыш
- При победе результат автоматически сохраняется в таблицу лидеров
- При проигрыше файл сохранения удаляется
